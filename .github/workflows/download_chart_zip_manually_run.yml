name: Download Chart Zips (Manual Run)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: chart-zip-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download next 50 zips
        run: |
          python << 'EOF'
          import json
          import requests
          from pathlib import Path

          INFO_DIR = Path("chart/info")
          ZIP_DIR = Path("chart/zip")

          ZIP_DIR.mkdir(parents=True, exist_ok=True)

          # 读取 release 中的 zip 文件列表
          existing = []
          
          try:
              response = requests.get(
                  "https://api.github.com/repos/wiorigami/phiyuri/releases",
                  headers={"Authorization": "token ${{ github.token }}"},
                  timeout=30
              )
              response.raise_for_status()
              
              for release in response.json():
                  for asset in release.get("assets", []):
                      if asset["name"].endswith(".zip"):
                          try:
                              cid = int(asset["name"].replace(".zip", ""))
                              existing.append(cid)
                          except:
                              pass
          except Exception as e:
              print(f"Warning: Could not fetch release assets: {e}")

          max_zip_id = max(existing) if existing else 0

          print("Current max zip id:", max_zip_id)

          info_files = []

          for f in INFO_DIR.glob("*.json"):
              try:
                  cid = int(f.stem)
                  if cid > max_zip_id:
                      info_files.append((cid, f))
              except:
                  pass

          info_files.sort(key=lambda x: x[0])

          targets = info_files[:50]

          print("Need download:", len(targets))

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          downloaded = 0
          temp_files = []

          for cid, json_file in targets:
              try:
                  data = json.loads(
                      json_file.read_text(encoding="utf-8")
                  )

                  url = data.get("file")

                  if not url:
                      continue

                  out_file = ZIP_DIR / f"{cid}.zip"

                  print("Downloading", cid)

                  r = session.get(
                      url,
                      timeout=60,
                      stream=True
                  )

                  r.raise_for_status()

                  with open(out_file, "wb") as f:
                      for chunk in r.iter_content(65536):
                          if chunk:
                              f.write(chunk)

                  temp_files.append(str(out_file))
                  downloaded += 1

              except Exception as e:
                  print("Failed", cid, e)

          # 保存下载文件列表供后续步骤使用
          with open(".downloaded_files", "w") as f:
              for file_path in temp_files:
                  f.write(file_path + "\n")

          print("Downloaded:", downloaded)
          EOF

      - name: Create or update Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // 读取下载的文件列表
            let filesToUpload = [];
            try {
              const content = fs.readFileSync('.downloaded_files', 'utf-8');
              filesToUpload = content.trim().split('\n').filter(f => f);
            } catch (e) {
              console.log('No files downloaded');
              return;
            }
            
            if (filesToUpload.length === 0) {
              console.log('No files to upload');
              return;
            }

            // 获取所有 Release 找最新的
            let releases = [];
            let releaseId = null;
            let releaseIndex = 1;
            
            try {
              const response = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              
              releases = response.data.filter(r => 
                r.tag_name.startsWith('chart-zips')
              );
              
              console.log('Found existing releases:', releases.length);
              
              if (releases.length > 0) {
                // 按 tag 名排序找最新的
                releases.sort((a, b) => {
                  const aNum = parseInt(a.tag_name.split('-')[2]) || 0;
                  const bNum = parseInt(b.tag_name.split('-')[2]) || 0;
                  return bNum - aNum;
                });
                
                const latestRelease = releases[0];
                const assetCount = latestRelease.assets.length;
                
                console.log(`Latest release: ${latestRelease.tag_name} (${assetCount}/1000 files)`);
                
                // 检查是否有空间
                if (assetCount + filesToUpload.length <= 1000) {
                  releaseId = latestRelease.id;
                  console.log('Using existing release');
                } else {
                  releaseIndex = parseInt(latestRelease.tag_name.split('-')[2]) + 1;
                  console.log(`Latest release is full, will create release #${releaseIndex}`);
                }
              }
            } catch (error) {
              console.log('No existing releases found');
            }

            // 如果需要新 Release，创建它
            if (!releaseId) {
              const tagName = `chart-zips-${releaseIndex}`;
              const releaseName = `Chart Zips Storage [Part ${releaseIndex}]`;
              
              console.log(`Creating new release: ${tagName}`);
              
              const createReleaseResponse = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: releaseName,
                body: `Storage for downloaded chart zip files - Part ${releaseIndex}`,
                draft: false,
                prerelease: false
              });
              releaseId = createReleaseResponse.data.id;
              console.log(`Created release: ${tagName}`);
            }

            // 上传每个文件
            for (const filePath of filesToUpload) {
              try {
                const filename = path.basename(filePath);
                const fileContent = fs.readFileSync(filePath);
                
                console.log(`Uploading ${filename}...`);
                
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId,
                  name: filename,
                  data: fileContent,
                  headers: {
                    'content-type': 'application/zip',
                    'content-length': fileContent.length
                  }
                });
                
                console.log(`✓ Uploaded ${filename}`);
              } catch (error) {
                if (error.message.includes('file_count limited')) {
                  console.log('Release is full, will create new one in next run');
                  break;
                }
                console.log(`✗ Failed to upload ${path.basename(filePath)}: ${error.message}`);
              }
            }

      - name: Clean up temp files
        if: always()
        run: |
          rm -f .downloaded_files
          rm -rf chart/zip
