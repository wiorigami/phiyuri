name: Download Next 50 Chart Zips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Download next 50 zips
        run: |
          python << 'EOF'
          import json
          import time
          from pathlib import Path
          import requests

          ZIP_DIR = Path("chart/zip")
          INFO_DIR = Path("chart/info")

          ZIP_DIR.mkdir(parents=True, exist_ok=True)

          MAX_LIMIT = 59945
          BATCH_SIZE = 50

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          # =========================
          # 1. 找当前最大ID
          # =========================
          existing_ids = []

          for f in ZIP_DIR.glob("*.zip"):
              try:
                  existing_ids.append(int(f.stem))
              except:
                  pass

          if existing_ids:
              current = max(existing_ids)
          else:
              current = 0

          start_id = current + 1

          print(f"Current max ID: {current}")
          print(f"Start ID: {start_id}")
          print(f"Max limit: {MAX_LIMIT}")

          downloaded = 0
          skipped = 0
          failed = 0

          # =========================
          # 2. 循环下载50个
          # =========================
          cid = start_id

          while downloaded < BATCH_SIZE and cid <= MAX_LIMIT:

              url = f"https://api.phira.cn/chart/{cid}"

              try:
                  r = session.get(url, timeout=30)

                  if r.status_code != 200:
                      print(f"Skip {cid} (status {r.status_code})")
                      cid += 1
                      continue

                  data = r.json()

                  # 跳过无效
                  if isinstance(data, dict) and data.get("error"):
                      print(f"Skip {cid} (error)")
                      cid += 1
                      continue

                  out_path = ZIP_DIR / f"{cid}.zip"

                  if out_path.exists():
                      skipped += 1
                      cid += 1
                      continue

                  # 下载 file
                  file_url = data.get("file")
                  if not file_url:
                      print(f"Skip {cid} (no file)")
                      cid += 1
                      continue

                  file_resp = session.get(file_url, timeout=60)

                  if file_resp.status_code == 200:
                      out_path.write_bytes(file_resp.content)
                      downloaded += 1
                      print(f"Downloaded {cid} ({downloaded}/50)")
                  else:
                      print(f"Failed file {cid}")

                  time.sleep(0.4)  # 限速

              except Exception as e:
                  failed += 1
                  print(f"Error {cid}: {e}")

              cid += 1

          print()
          print("========== DONE ==========")
          print("downloaded:", downloaded)
          print("skipped:", skipped)
          print("failed:", failed)
          print("stopped at:", cid)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chart/zip

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Batch download 50 charts"
          git push
