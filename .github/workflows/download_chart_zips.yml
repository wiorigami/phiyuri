name: Download Next 50 Chart Zips (Safe Rebase)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Download next 50 zips
        run: |
          python << 'EOF'
          import json
          import time
          from pathlib import Path
          import requests

          ZIP_DIR = Path("chart/zip")
          INFO_DIR = Path("chart/info")

          ZIP_DIR.mkdir(parents=True, exist_ok=True)

          MAX_LIMIT = 59945
          BATCH_SIZE = 50

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          # =========================
          # 1. 获取最大 zip ID
          # =========================
          existing_ids = []

          for f in ZIP_DIR.glob("*.zip"):
              try:
                  existing_ids.append(int(f.stem))
              except:
                  pass

          max_id = max(existing_ids) if existing_ids else 0
          print(f"Current max zip ID: {max_id}")

          # =========================
          # 2. 找 info 中更大的 ID
          # =========================
          candidates = []

          for f in INFO_DIR.glob("*.json"):
              try:
                  data = json.loads(f.read_text(encoding="utf-8"))
                  cid = data.get("id")
                  if cid and max_id < cid <= MAX_LIMIT:
                      candidates.append((cid, data.get("file")))
              except:
                  pass

          candidates.sort(key=lambda x: x[0])

          print(f"Found {len(candidates)} candidates")

          downloaded = 0
          skipped = 0
          failed = 0

          # =========================
          # 3. 下载最多 50 个
          # =========================
          for cid, url in candidates:

              if downloaded >= BATCH_SIZE:
                  break

              if not url:
                  continue

              out_path = ZIP_DIR / f"{cid}.zip"

              if out_path.exists():
                  skipped += 1
                  continue

              try:
                  r = session.get(url, timeout=60)

                  if r.status_code != 200:
                      print(f"Skip {cid} status {r.status_code}")
                      continue

                  out_path.write_bytes(r.content)

                  downloaded += 1
                  print(f"Downloaded {cid} ({downloaded}/50)")

                  time.sleep(0.4)

              except Exception as e:
                  failed += 1
                  print(f"Error {cid}: {e}")

          print()
          print("========== DONE ==========")
          print("downloaded:", downloaded)
          print("skipped:", skipped)
          print("failed:", failed)
          EOF

      - name: Commit and push safely (rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chart/zip

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Batch download 50 charts"

          # =========================
          # 防冲突核心修复
          # =========================
          git pull --rebase origin main || true

          git push
