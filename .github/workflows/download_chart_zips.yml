name: Fetch Phira Charts (5min)

on:
  schedule:
    - cron: "*/5 * * * *"   # 每5分钟（UTC）
  workflow_dispatch:        # 允许手动运行

permissions:
  contents: write

concurrency:
  group: phira-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch charts
        run: |
          python << 'EOF'
          import json
          import time
          from pathlib import Path
          import requests

          INFO_DIR = Path("chart/info")
          INFO_DIR.mkdir(parents=True, exist_ok=True)

          UPDATE_URL = "https://api.phira.cn/chart?page=1&order=-updated"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          print("Fetching update list...")

          resp = session.get(UPDATE_URL, timeout=30)
          resp.raise_for_status()

          data = resp.json()

          # 保存 update 快照
          Path("chart/update.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          results = data.get("results", [])
          print("Total results:", len(results))

          updated_count = 0

          for item in results:
              cid = item.get("id")
              if not cid:
                  continue

              url = f"https://api.phira.cn/chart/{cid}"

              try:
                  r = session.get(url, timeout=30)
                  if r.status_code != 200:
                      print("skip", cid, r.status_code)
                      continue

                  chart = r.json()

                  # 跳过错误数据
                  if chart.get("error") == "找不到指定实体":
                      continue

                  file_path = INFO_DIR / f"{cid}.json"

                  new_content = json.dumps(
                      chart,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True
                  )

                  old_content = None
                  if file_path.exists():
                      old_content = file_path.read_text(encoding="utf-8")

                  if old_content != new_content:
                      file_path.write_text(new_content, encoding="utf-8")
                      updated_count += 1
                      print("updated", cid)

                  time.sleep(0.3)

              except Exception as e:
                  print("error", cid, e)

          print("DONE, updated:", updated_count)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chart/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto update charts"

          git pull --rebase origin main || true

          git push
