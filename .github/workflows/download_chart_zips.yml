# 在 "Create or update Release" 步骤中替换 JavaScript 脚本

      - name: Create or update Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // 读取下载的文件列表
            let filesToUpload = [];
            try {
              const content = fs.readFileSync('.downloaded_files', 'utf-8');
              filesToUpload = content.trim().split('\n').filter(f => f);
            } catch (e) {
              console.log('No files downloaded');
              return;
            }
            
            if (filesToUpload.length === 0) {
              console.log('No files to upload');
              return;
            }

            // 查找合适的 Release
            let releaseId = null;
            let currentReleaseIndex = 1;
            
            try {
              // 获取所有 release
              const releasesResponse = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              
              const releases = releasesResponse.data.filter(r => r.name && r.name.startsWith('Chart Zips Storage'));
              
              if (releases.length > 0) {
                // 找最新的 Release
                const latestRelease = releases[0];
                currentReleaseIndex = parseInt(latestRelease.name.match(/\d+/)[0]) || 1;
                
                // 检查文件数量
                const assetCount = latestRelease.assets.length;
                console.log(`Latest release (${latestRelease.name}) has ${assetCount} files`);
                
                if (assetCount + filesToUpload.length <= 1000) {
                  // 可以继续用这个 release
                  releaseId = latestRelease.id;
                  console.log('Using existing release');
                } else {
                  // 需要创建新 release
                  currentReleaseIndex++;
                  console.log('Current release is full, creating new one');
                }
              }
            } catch (error) {
              console.log('No existing releases found');
            }
            
            // 如果没有 releaseId，创建新的 Release
            if (!releaseId) {
              const releaseName = `Chart Zips Storage [Part ${currentReleaseIndex}]`;
              const releaseTag = `chart-zips-${currentReleaseIndex}`;
              
              const createReleaseResponse = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: releaseTag,
                name: releaseName,
                body: `Storage for downloaded chart zip files - Part ${currentReleaseIndex}\n\nMax 1000 files per release`,
                draft: false,
                prerelease: false
              });
              releaseId = createReleaseResponse.data.id;
              console.log(`Created new release: ${releaseName}`);
            }

            // 上传每个文件
            for (const filePath of filesToUpload) {
              try {
                const filename = path.basename(filePath);
                const fileContent = fs.readFileSync(filePath);
                
                console.log(`Uploading ${filename}...`);
                
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId,
                  name: filename,
                  data: fileContent,
                  headers: {
                    'content-type': 'application/zip',
                    'content-length': fileContent.length
                  }
                });
                
                console.log(`✓ Uploaded ${filename}`);
              } catch (error) {
                if (error.message.includes('file_count limited')) {
                  console.log(`Release is full, will create new one in next run`);
                  break;
                }
                console.log(`✗ Failed to upload ${path.basename(filePath)}: ${error.message}`);
              }
            }
