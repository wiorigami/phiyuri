name: Download Chart Zips (Loop)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: chart-zip-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download next 50 zips
        run: |
          python << 'EOF'
          import json
          import requests
          from pathlib import Path

          INFO_DIR = Path("chart/info")
          ZIP_DIR = Path("chart/zip")

          ZIP_DIR.mkdir(parents=True, exist_ok=True)

          # 获取 zip 目录最大ID
          existing = []

          for f in ZIP_DIR.glob("*.zip"):
              try:
                  existing.append(int(f.stem))
              except:
                  pass

          max_zip_id = max(existing) if existing else 0

          print("Current max zip id:", max_zip_id)

          info_files = []

          for f in INFO_DIR.glob("*.json"):
              try:
                  cid = int(f.stem)
                  if cid > max_zip_id:
                      info_files.append((cid, f))
              except:
                  pass

          info_files.sort(key=lambda x: x[0])

          targets = info_files[:50]

          print("Need download:", len(targets))

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          downloaded = 0

          for cid, json_file in targets:
              try:
                  data = json.loads(
                      json_file.read_text(encoding="utf-8")
                  )

                  url = data.get("file")

                  if not url:
                      continue

                  out_file = ZIP_DIR / f"{cid}.zip"

                  if out_file.exists():
                      continue

                  print("Downloading", cid)

                  r = session.get(
                      url,
                      timeout=60,
                      stream=True
                  )

                  r.raise_for_status()

                  with open(out_file, "wb") as f:
                      for chunk in r.iter_content(65536):
                          if chunk:
                              f.write(chunk)

                  downloaded += 1

              except Exception as e:
                  print("Failed", cid, e)

          print("Downloaded:", downloaded)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chart/zip

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Batch download 50 charts"

            git pull --rebase origin main || true

            git push
          fi

      - name: Wait 120 seconds
        run: sleep 120

      - name: Trigger next run
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "download_chart_zips.yml",
              ref: "main"
            })
