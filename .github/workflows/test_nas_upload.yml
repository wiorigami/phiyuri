name: NAS API No-Port Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Synology Login (no port)
        run: |
          python << 'EOF'
          import requests

          NAS_URL = "${{ secrets.NAS_URL }}"
          USER = "${{ secrets.NAS_USERNAME }}"
          PASS = "${{ secrets.NAS_PASSWORD }}"

          # ⚠️ 按你要求：不加端口
          BASE = f"https://{NAS_URL}"

          url = f"{BASE}/webapi/auth.cgi"

          params = {
              "api": "SYNO.API.Auth",
              "version": "3",
              "method": "login",
              "account": USER,
              "passwd": PASS,
              "session": "FileStation",
              "format": "sid"
          }

          print("Request URL:")
          print(url)

          r = requests.get(url, params=params, timeout=30)

          print("Status:", r.status_code)
          print("Response:", r.text)

          data = r.json()

          if data.get("success"):
              print("LOGIN OK")
              print("SID:", data["data"]["sid"])
          else:
              print("LOGIN FAILED")
          EOF
