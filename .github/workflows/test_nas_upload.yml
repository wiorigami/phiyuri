name: NAS Upload Test

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Create file
        run: echo "hello nas $(date)" > test.txt

      - name: Upload to NAS
        run: |
          python << 'EOF'
          import requests

          NAS_URL = "${{ secrets.NAS_URL }}"
          USER = "${{ secrets.NAS_USERNAME }}"
          PASS = "${{ secrets.NAS_PASSWORD }}"

          BASE = f"https://{NAS_URL}"

          # 1. login
          login = requests.get(
              f"{BASE}/webapi/auth.cgi",
              params={
                  "api":"SYNO.API.Auth",
                  "version":"3",
                  "method":"login",
                  "account":USER,
                  "passwd":PASS,
                  "session":"FileStation",
                  "format":"sid"
              }
          ).json()

          sid = login["data"]["sid"]
          print("SID OK")

          # 2. upload
          files = {"file": open("test.txt","rb")}

          upload = requests.post(
              f"{BASE}/webapi/entry.cgi",
              params={
                  "api":"SYNO.FileStation.Upload",
                  "version":"2",
                  "method":"upload",
                  "path":"/home/",
                  "create_parents":"true",
                  "_sid":sid
              },
              files=files
          )

          print(upload.text)
          EOF
