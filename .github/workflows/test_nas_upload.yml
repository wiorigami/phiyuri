name: NAS Drive Upload Test

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Create test file
        run: echo "drive api upload test $(date)" > test.txt

      - name: Upload via Synology Drive API
        run: |
          python << 'EOF'
          import requests

          NAS = "${{ secrets.NAS_URL }}"
          USER = "${{ secrets.NAS_USERNAME }}"
          PASS = "${{ secrets.NAS_PASSWORD }}"

          BASE = f"https://{NAS}"

          print("Login...")

          # 1. login (Drive session)
          r = requests.get(
              f"{BASE}/webapi/auth.cgi",
              params={
                  "api": "SYNO.API.Auth",
                  "version": "3",
                  "method": "login",
                  "account": USER,
                  "passwd": PASS,
                  "session": "Drive",
                  "format": "sid"
              },
              timeout=30
          )

          j = r.json()
          sid = j["data"]["sid"]
          print("SID OK")

          # 2. Drive upload
          with open("test.txt", "rb") as f:
              files = {
                  "file": f
              }

              r = requests.post(
                  f"{BASE}/webapi/entry.cgi",
                  params={
                      "api": "SYNO.Drive.Files",
                      "version": "2",
                      "method": "upload",
                      "path": "/home/",
                      "create_parents": "true",
                      "_sid": sid
                  },
                  files=files,
                  timeout=120
              )

          print(r.text)
          EOF
