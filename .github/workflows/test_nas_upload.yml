name: Test Synology Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create test file
        run: |
          echo "hello nas $(date)" > test.txt

      - name: Upload to Synology NAS
        uses: bungabear/synology_upload_action@v1.0.0
        with:
          host: ${{ secrets.NAS_URL }}
          username: ${{ secrets.NAS_USERNAME }}
          password: ${{ secrets.NAS_PASSWORD }}

          filepath: './test.txt'
          uploadpath: '/home/'
          filename: 'test.txt'

          overwrite: true
          createparent: true
