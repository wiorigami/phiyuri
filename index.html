<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phira Charts Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            display: flex;
            height: calc(100vh - 180px);
        }
        
        .sidebar {
            width: 300px;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            background: #f5f5f5;
        }
        
        .file-list {
            list-style: none;
        }
        
        .file-item {
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
        
        .file-item:hover {
            background: #e8e8e8;
            padding-left: 20px;
        }
        
        .file-item.active {
            background: #667eea;
            color: white;
            border-left: 4px solid #764ba2;
        }
        
        .file-icon {
            width: 16px;
            display: inline-block;
            text-align: center;
        }
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow: hidden;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .controls input[type="file"] {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .controls button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-value {
            font-weight: 600;
            color: #333;
        }
        
        .viewer {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
        }
        
        .viewer-header {
            padding: 12px 16px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .viewer-content {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        
        .json-viewer {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .json-viewer {
            color: #24292e;
        }
        
        .json-key {
            color: #6f42c1;
            font-weight: 600;
        }
        
        .json-string {
            color: #032f62;
        }
        
        .json-number {
            color: #005cc5;
        }
        
        .json-boolean {
            color: #d73a49;
            font-weight: 600;
        }
        
        .json-null {
            color: #6f42c1;
            font-weight: 600;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #667eea;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }
        
        .error {
            padding: 16px;
            background: #fff5f5;
            color: #c53030;
            border-radius: 6px;
            border-left: 4px solid #c53030;
        }
        
        .download-btn {
            background: #10b981;
            padding: 8px 12px;
            font-size: 12px;
        }
        
        .download-btn:hover {
            background: #059669;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                height: auto;
            }
            
            .sidebar {
                width: 100%;
                max-height: 300px;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Phira Charts Viewer</h1>
            <p>在线查看 ZIP 文件内容</p>
        </div>
        
        <div class="controls" style="padding: 20px 30px;">
            <input type="file" id="zipFile" accept=".zip" placeholder="选择 ZIP 文件">
            <input type="text" id="releaseUrl" placeholder="或输入 Release URL (例如: https://github.com/owner/repo/releases/download/tag/file.zip)" value="">
            <button onclick="loadFromUrl()">从 URL 加载</button>
            <button class="download-btn" onclick="downloadCurrentFile()">下载当前文件</button>
        </div>
        
        <div class="stats" style="padding: 0 30px; display: none;" id="stats">
            <div class="stat-item">
                📁 文件总数: <span class="stat-value" id="fileCount">0</span>
            </div>
            <div class="stat-item">
                📊 总大小: <span class="stat-value" id="totalSize">0 B</span>
            </div>
            <div class="stat-item">
                🔍 搜索结果: <span class="stat-value" id="searchCount">0</span>
            </div>
        </div>
        
        <div class="content">
            <div class="sidebar">
                <input type="text" id="searchInput" placeholder="搜索文件..." style="width: 100%; padding: 10px 12px; border: none; border-bottom: 1px solid #ddd; font-size: 13px;">
                <ul class="file-list" id="fileList"></ul>
            </div>
            
            <div class="main">
                <div class="viewer">
                    <div class="viewer-header">
                        <span id="currentFile">选择一个文件查看内容</span>
                        <button class="download-btn" onclick="downloadCurrentFile()" style="display: none;" id="downloadBtn">下载</button>
                    </div>
                    <div class="viewer-content" id="viewerContent">
                        <div class="empty">选择一个文件开始查看</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let zipData = null;
        let allFiles = [];
        let currentFile = null;

        // 文件上传
        document.getElementById('zipFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    loadZip(event.target.result);
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.file-item');
            let visibleCount = 0;
            items.forEach(item => {
                const filename = item.dataset.filename.toLowerCase();
                if (filename.includes(query)) {
                    item.style.display = '';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });
            document.getElementById('searchCount').textContent = visibleCount;
        });

        // 从 URL 加载
        async function loadFromUrl() {
            const url = document.getElementById('releaseUrl').value.trim();
            if (!url) {
                alert('请输入 URL');
                return;
            }

            const content = document.getElementById('viewerContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><span>加载中...</span></div>';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const buffer = await response.arrayBuffer();
                loadZip(buffer);
            } catch (error) {
                content.innerHTML = `<div class="error">❌ 加载失败: ${error.message}</div>`;
            }
        }

        // 加载 ZIP 文件
        async function loadZip(buffer) {
            try {
                const zip = await JSZip.loadAsync(buffer);
                zipData = zip;
                allFiles = [];

                zip.forEach((path, file) => {
                    if (!path.endsWith('/')) {
                        allFiles.push(path);
                    }
                });

                allFiles.sort();
                displayFileList(allFiles);
                updateStats();
                document.getElementById('stats').style.display = 'flex';
            } catch (error) {
                document.getElementById('viewerContent').innerHTML = `<div class="error">❌ 解析 ZIP 失败: ${error.message}</div>`;
            }
        }

        // 显示文件列表
        function displayFileList(files) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            files.forEach(filename => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.dataset.filename = filename;
                
                // 文件图标
                let icon = '📄';
                if (filename.endsWith('.json')) icon = '📋';
                else if (filename.endsWith('.txt')) icon = '📝';
                else if (filename.endsWith('.jpg') || filename.endsWith('.png')) icon = '🖼️';
                else if (filename.endsWith('.zip')) icon = '📦';
                else if (filename.endsWith('/')) icon = '📁';

                li.innerHTML = `<span class="file-icon">${icon}</span><span>${filename}</span>`;
                li.onclick = () => viewFile(filename, li);
                fileList.appendChild(li);
            });
        }

        // 查看文件
        async function viewFile(filename, element) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentFile = filename;

            const content = document.getElementById('viewerContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><span>加载中...</span></div>';
            document.getElementById('currentFile').textContent = filename;
            document.getElementById('downloadBtn').style.display = 'inline-block';

            try {
                const file = zipData.file(filename);
                if (!file) throw new Error('文件不存在');

                const ext = filename.split('.').pop().toLowerCase();
                
                if (['json', 'txt', 'csv', 'xml', 'html', 'css', 'js'].includes(ext)) {
                    const text = await file.async('string');
                    
                    if (ext === 'json') {
                        try {
                            const json = JSON.parse(text);
                            content.innerHTML = `<pre class="json-viewer">${JSON.stringify(json, null, 2)}</pre>`;
                        } catch (e) {
                            content.innerHTML = `<pre class="json-viewer">${text}</pre>`;
                        }
                    } else {
                        content.innerHTML = `<pre class="json-viewer">${escapeHtml(text.substring(0, 50000))}</pre>`;
                        if (text.length > 50000) {
                            content.innerHTML += `<div class="error">📌 文件过大，只显示前 50000 个字符</div>`;
                        }
                    }
                } else if (['jpg', 'png', 'gif', 'webp'].includes(ext)) {
                    const blob = await file.async('blob');
                    const url = URL.createObjectURL(blob);
                    content.innerHTML = `<img src="${url}" style="max-width: 100%; max-height: 100%; object-fit: contain; margin: auto;">`;
                } else {
                    const blob = await file.async('blob');
                    content.innerHTML = `<div class="empty">🔒 二进制文件，无法直接预览<br><small>${(blob.size / 1024).toFixed(2)} KB</small></div>`;
                }
            } catch (error) {
                content.innerHTML = `<div class="error">❌ 加载失败: ${error.message}</div>`;
            }
        }

        // 下载当前文件
        async function downloadCurrentFile() {
            if (!currentFile || !zipData) return;

            try {
                const file = zipData.file(currentFile);
                const blob = await file.async('blob');
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentFile.split('/').pop();
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('下载失败: ' + error.message);
            }
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('fileCount').textContent = allFiles.length;
            let totalSize = 0;
            allFiles.forEach(filename => {
                const file = zipData.file(filename);
                if (file) {
                    totalSize += file._data.uncompressedSize || 0;
                }
            });
            document.getElementById('totalSize').textContent = formatBytes(totalSize);
            document.getElementById('searchCount').textContent = allFiles.length;
        }

        // 格式化字节
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
