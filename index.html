<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chart Explorer</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
    background: #0b0f14;
    color: #e6edf3;
}

/* 顶部搜索区 */
.header {
    position: sticky;
    top: 0;
    background: rgba(13, 17, 23, 0.9);
    backdrop-filter: blur(12px);
    padding: 20px;
    display: flex;
    justify-content: center;
    border-bottom: 1px solid #1f2937;
}

.search-box {
    width: 60%;
    max-width: 700px;
    display: flex;
    gap: 10px;
}

.search-box input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #30363d;
    background: #161b22;
    color: white;
    outline: none;
    font-size: 16px;
}

/* 结果区 */
.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 20px;
}

/* 卡片 */
.card {
    display: flex;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.01);
    border-color: #58a6ff;
}

.card img {
    width: 140px;
    height: 100px;
    object-fit: cover;
    background: #0b0f14;
}

.card-content {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.title {
    font-size: 16px;
    font-weight: 600;
}

.sub {
    font-size: 13px;
    color: #8b949e;
    margin-top: 6px;
}

/* 详情 */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal-content {
    width: 600px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    max-height: 80vh;
    overflow-y: auto;
}

button {
    margin-top: 10px;
    padding: 10px 12px;
    background: #238636;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
    <div class="search-box">
        <input id="search" placeholder="Search by name / id / composer..." />
    </div>
</div>

<div class="container" id="results"></div>

<!-- modal -->
<div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
// ===== 数据加载 =====
// 直接读取 chart/info 下所有 json（需要你用 GitHub Pages / 本地服务器运行）
let charts = [];

// 模拟加载（GitHub Pages 推荐 fetch）
async function loadData() {
    const res = await fetch("./chart/index.json").catch(()=>null);

    // fallback：如果你没有 index.json
    if (!res) return;

    charts = await res.json();
}

loadData();

// ===== 搜索 =====
const searchInput = document.getElementById("search");
const results = document.getElementById("results");

function match(chart, q) {
    q = q.toLowerCase();

    return (
        String(chart.id).includes(q) ||
        (chart.name || "").toLowerCase().includes(q) ||
        (chart.composer || "").toLowerCase().includes(q)
    );
}

function render(list) {
    results.innerHTML = "";

    list.forEach(c => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${c.illustration || ''}" />
            <div class="card-content">
                <div class="title">${c.name} (ID:${c.id})</div>
                <div class="sub">${c.composer || 'Unknown composer'}</div>
            </div>
        `;

        card.onclick = () => openModal(c);
        results.appendChild(card);
    });
}

searchInput.addEventListener("input", (e) => {
    const q = e.target.value.trim();
    if (!q) return results.innerHTML = "";

    const filtered = charts.filter(c => match(c, q));
    render(filtered);
});

// ===== 详情 =====
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");

function openModal(c) {
    modal.style.display = "flex";

    modalContent.innerHTML = `
        <h2>${c.name}</h2>
        <pre style="white-space:pre-wrap;color:#c9d1d9">${JSON.stringify(c, null, 2)}</pre>

        <button onclick="window.open('https://phira.moe/chart/${c.id}', '_blank')">
            在 Phira 官网查看
        </button>
    `;
}

modal.onclick = (e) => {
    if (e.target === modal) modal.style.display = "none";
};
</script>

</body>
</html>
